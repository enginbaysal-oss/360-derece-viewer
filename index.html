<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>360° Görüntüleyici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #0a0b0d;
    --panel: #14171bdd;
    --panel-solid: #14171b;
    --copper: #e8a33d;
    --copper-dim: #e8a33d55;
    --teal: #4fa394;
    --text: #edeae3;
    --text-muted: #767c85;
    --border: #e8a33d26;
    --radius: 999px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #scene{ position:fixed; inset:0; touch-action:none; }
  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing:0.02em; }

  /* ---------- Empty state ---------- */
  #empty{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; z-index:5; text-align:center; padding:24px;
    background:
      radial-gradient(circle at 50% 42%, #1a1d22 0%, #0a0b0d 70%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #empty.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .aperture{
    position:relative; width:132px; height:132px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #23262b, #0e0f11 70%);
    border:1px solid var(--border);
    box-shadow: 0 0 0 1px #ffffff08 inset, 0 30px 60px -20px #000a, 0 0 40px -10px var(--copper-dim);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  }
  .aperture:active{ transform:scale(0.94); }
  .aperture-blade{
    position:absolute; inset:8px; border-radius:50%;
    border:1px solid var(--copper-dim);
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
  }
  .aperture-blade:nth-child(1){ inset:8px; }
  .aperture-blade:nth-child(2){ inset:20px; border-color:#e8a33d3a; }
  .aperture-blade:nth-child(3){ inset:32px; border-color:#e8a33d55; }
  .aperture:hover .aperture-blade:nth-child(1){ inset:2px; }
  .aperture:hover .aperture-blade:nth-child(2){ inset:16px; }
  .aperture:hover .aperture-blade:nth-child(3){ inset:30px; }
  .aperture-core{
    width:14px; height:14px; border-radius:50%; background:var(--copper);
    box-shadow:0 0 18px 2px var(--copper-dim);
  }

  #empty h1{
    font-size:22px; font-weight:600; margin:0; letter-spacing:-0.01em;
  }
  #empty p{
    margin:0; max-width:280px; font-size:14px; line-height:1.55; color:var(--text-muted);
  }
  #empty .hint{
    font-size:11px; color:var(--text-muted); opacity:.7;
  }
  #fileLabel{ cursor:pointer; }
  #fileInput{ display:none; }

  #empty.dragover .aperture{
    box-shadow: 0 0 0 1px #ffffff08 inset, 0 30px 60px -20px #000a, 0 0 60px -6px var(--copper);
    transform:scale(1.05);
  }

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(16px, env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(to bottom, #000000a0, transparent);
    opacity:0; visibility:hidden; transition:opacity .4s ease, visibility .4s ease;
    pointer-events:none;
  }
  #topbar.show{ opacity:1; visibility:visible; pointer-events:auto; }
  .brand{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  .brand-dot{ width:7px; height:7px; border-radius:50%; background:var(--copper); box-shadow:0 0 10px 1px var(--copper-dim); }
  #filename{ font-size:11px; color:var(--text-muted); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
    background:#14171bbb; backdrop-filter:blur(8px); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: background .2s ease, transform .15s ease, border-color .2s ease;
  }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn.active{ border-color:var(--teal); color:var(--teal); }
  .icon-btn svg{ width:17px; height:17px; }

  /* ---------- Compass ---------- */
  #compass{
    position:fixed; top:70px; right:18px; z-index:9;
    width:46px; height:46px; border-radius:50%;
    border:1px solid var(--border); background:#14171bbb; backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease;
  }
  #compass.show{ opacity:1; visibility:visible; }
  #compass-needle{ width:2px; height:16px; background:var(--copper); border-radius:2px; transform-origin:50% 100%; position:relative; top:-6px; }
  #compass-deg{ position:absolute; bottom:-16px; font-size:9px; color:var(--text-muted); }

  /* ---------- Bottom dock ---------- */
  #dock{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding: 16px 18px max(20px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, #000000a8, transparent);
    opacity:0; visibility:hidden; transition:opacity .4s ease, visibility .4s ease;
    pointer-events:none;
  }
  #dock.show{ opacity:1; visibility:visible; pointer-events:auto; }
  .dock-btn{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--border);
    background:#14171bcc; backdrop-filter:blur(10px); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: transform .15s ease, border-color .2s ease, color .2s ease;
  }
  .dock-btn:active{ transform:scale(0.9); }
  .dock-btn.primary{ width:60px; height:60px; background:var(--copper); color:#0a0b0d; border-color:var(--copper); }
  .dock-btn.active{ border-color:var(--teal); color:var(--teal); }
  .dock-btn svg{ width:20px; height:20px; }
  .dock-btn.primary svg{ width:24px; height:24px; }

  /* ---------- Progress (video) ---------- */
  #progress-wrap{
    position:fixed; left:18px; right:18px; bottom:98px; z-index:10;
    opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease;
  }
  #progress-wrap.show{ opacity:1; visibility:visible; }
  #progress-bar{ position:relative; height:3px; border-radius:3px; background:#ffffff22; overflow:hidden; }
  #progress-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--copper); }

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:#0a0b0dcc; backdrop-filter:blur(6px); flex-direction:column; gap:14px;
  }
  #loading.show{ display:flex; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:2px solid #e8a33d33; border-top-color:var(--copper);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading span{ font-size:12px; color:var(--text-muted); }

  #toast{
    position:fixed; left:50%; top:20px; transform:translateX(-50%) translateY(-140%);
    z-index:30; background:var(--panel-solid); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:12px; font-size:12.5px; max-width:80vw; text-align:center;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="scene"></div>

<div id="loading"><div class="spinner"></div><span class="mono">İŞLENİYOR…</span></div>
<div id="toast" class="mono"></div>

<div id="empty">
  <label id="fileLabel" for="fileInput">
    <div class="aperture">
      <div class="aperture-blade"></div>
      <div class="aperture-blade"></div>
      <div class="aperture-blade"></div>
      <div class="aperture-core"></div>
    </div>
  </label>
  <div>
    <h1>360° Görüntüleyici</h1>
    <p>Insta360 ile çektiğin 360° foto veya videoyu buraya yükle. Parmağınla çevir, ya da jiroskopla telefonu döndürerek her yöne bak.</p>
  </div>
  <span class="hint mono">EQUIRECTANGULAR JPG · PNG · MP4 · MOV</span>
  <input type="file" id="fileInput" accept="image/*,video/*">
</div>

<div id="topbar">
  <div class="brand"><span class="brand-dot"></span>360°<span id="filename" class="mono"></span></div>
  <label for="fileInput" class="icon-btn" title="Yeni dosya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
  </label>
</div>

<div id="compass">
  <div id="compass-needle"></div>
  <span id="compass-deg" class="mono">0°</span>
</div>

<div id="progress-wrap">
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="dock">
  <div class="dock-btn" id="gyroBtn" title="Jiroskop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="12" rx="9" ry="4.2"/><ellipse cx="12" cy="12" rx="4.2" ry="9" transform="rotate(35 12 12)"/></svg>
  </div>
  <div class="dock-btn primary" id="playBtn" title="Oynat / Duraklat" style="display:none;">
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div class="dock-btn" id="muteBtn" title="Sesi Kapat" style="display:none;">
    <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
  </div>
  <div class="dock-btn" id="fsBtn" title="Tam ekran">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </div>
</div>

<script>
(function(){
  "use strict";

  const sceneEl = document.getElementById('scene');
  const emptyEl = document.getElementById('empty');
  const topbar = document.getElementById('topbar');
  const dock = document.getElementById('dock');
  const compass = document.getElementById('compass');
  const compassNeedle = document.getElementById('compass-needle');
  const compassDeg = document.getElementById('compass-deg');
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  const loading = document.getElementById('loading');
  const toastEl = document.getElementById('toast');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const gyroBtn = document.getElementById('gyroBtn');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const muteBtn = document.getElementById('muteBtn');
  const muteIcon = document.getElementById('muteIcon');
  const fsBtn = document.getElementById('fsBtn');

  let renderer, scene, camera, sphere, videoEl = null;
  let lon = 0, lat = 0, startLon = 0, startLat = 0, startX = 0, startY = 0, isDragging = false;
  let fov = 90, targetFov = 90;
  let gyroActive = false, gyroBaseAlpha = null;
  let isVideo = false, isPlaying = false;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> toastEl.classList.remove('show'), 2600);
  }

  function initThree(){
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(fov, window.innerWidth/window.innerHeight, 0.1, 1100);
    camera.position.set(0,0,0);

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    sceneEl.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(500, 64, 40);
    geometry.scale(-1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color:0x111214 });
    sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    animate();
    window.addEventListener('resize', onResize);
  }

  function onResize(){
    if(!renderer) return;
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate(){
    requestAnimationFrame(animate);
    if(!gyroActive){
      lat = Math.max(-85, Math.min(85, lat));
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      const target = new THREE.Vector3(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);
    }
    fov += (targetFov - fov) * 0.15;
    if(Math.abs(fov - camera.fov) > 0.01){
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }
    renderer.render(scene, camera);
  }

  /* ---------- Drag look controls ---------- */
  function onPointerDown(e){
    if(gyroActive) return;
    isDragging = true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startLon = lon; startLat = lat;
  }
  function onPointerMove(e){
    if(!isDragging || gyroActive) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;
    lon = startLon - dx * 0.15;
    lat = startLat + dy * 0.15;
  }
  function onPointerUp(){ isDragging = false; }

  sceneEl.addEventListener('mousedown', onPointerDown);
  sceneEl.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  sceneEl.addEventListener('touchstart', onPointerDown, {passive:true});
  sceneEl.addEventListener('touchmove', onPointerMove, {passive:true});
  sceneEl.addEventListener('touchend', onPointerUp);

  sceneEl.addEventListener('wheel', (e)=>{
    targetFov = Math.max(35, Math.min(100, targetFov + e.deltaY * 0.04));
  }, {passive:true});

  /* pinch zoom */
  let pinchStartDist = null, pinchStartFov = fov;
  sceneEl.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartFov = targetFov;
    }
  }, {passive:true});
  sceneEl.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2 && pinchStartDist){
      const d = dist(e.touches[0], e.touches[1]);
      targetFov = Math.max(35, Math.min(100, pinchStartFov * (pinchStartDist / d)));
    }
  }, {passive:true});
  function dist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }

  /* ---------- Gyroscope controls ---------- */
  const zee = new THREE.Vector3(0,0,1);
  const euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function setCameraQuaternion(alpha, beta, gamma, orient){
    euler.set(THREE.MathUtils.degToRad(beta), THREE.MathUtils.degToRad(alpha), -THREE.MathUtils.degToRad(gamma), 'YXZ');
    camera.quaternion.setFromEuler(euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
  }

  function onDeviceOrientation(e){
    if(e.alpha === null) return;
    const orient = (screen.orientation && screen.orientation.angle) ? THREE.MathUtils.degToRad(screen.orientation.angle) : 0;
    setCameraQuaternion(e.alpha, e.beta, e.gamma, orient);
    const heading = Math.round(360 - e.alpha);
    compassNeedle.style.transform = `rotate(${heading}deg)`;
    compassDeg.textContent = heading + '°';
  }

  function enableGyro(){
    function attach(){
      window.addEventListener('deviceorientation', onDeviceOrientation);
      gyroActive = true;
      gyroBtn.classList.add('active');
      compass.classList.add('show');
      toast('Jiroskop açık — telefonu çevirerek etrafa bak');
    }
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(state=>{
        if(state === 'granted') attach();
        else toast('Jiroskop izni verilmedi');
      }).catch(()=> toast('Jiroskop bu cihazda kullanılamıyor'));
    } else if('DeviceOrientationEvent' in window){
      attach();
    } else {
      toast('Bu cihaz jiroskop desteklemiyor');
    }
  }
  function disableGyro(){
    window.removeEventListener('deviceorientation', onDeviceOrientation);
    gyroActive = false;
    gyroBtn.classList.remove('active');
    compass.classList.remove('show');
  }
  gyroBtn.addEventListener('click', ()=> gyroActive ? disableGyro() : enableGyro());

  /* ---------- File loading ---------- */
  function showViewer(name){
    emptyEl.classList.add('hidden');
    topbar.classList.add('show');
    dock.classList.add('show');
    filenameEl.textContent = name;
  }

  function applyTexture(texture){
    texture.colorSpace = THREE.SRGBColorSpace || THREE.sRGBEncoding;
    texture.minFilter = THREE.LinearFilter;
    sphere.material.map = texture;
    sphere.material.color.set(0xffffff);
    sphere.material.needsUpdate = true;
  }

  function loadImage(url, name){
    loading.classList.add('show');
    const img = new Image();
    img.onload = function(){
      const tex = new THREE.Texture(img);
      tex.needsUpdate = true;
      applyTexture(tex);
      loading.classList.remove('show');
      showViewer(name);
      playBtn.style.display = 'none';
      muteBtn.style.display = 'none';
      progressWrap.classList.remove('show');
      isVideo = false;
    };
    img.onerror = function(){
      loading.classList.remove('show');
      toast('Görsel yüklenemedi. Dosya bozuk olabilir.');
    };
    img.src = url;
  }

  function loadVideo(url, name){
    loading.classList.add('show');
    if(videoEl){ videoEl.pause(); videoEl.src=''; }
    videoEl = document.createElement('video');
    videoEl.src = url;
    videoEl.crossOrigin = 'anonymous';
    videoEl.loop = true;
    videoEl.muted = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('webkit-playsinline', 'true');

    videoEl.addEventListener('loadeddata', function(){
      const tex = new THREE.VideoTexture(videoEl);
      applyTexture(tex);
      loading.classList.remove('show');
      showViewer(name);
      isVideo = true;
      playBtn.style.display = 'flex';
      muteBtn.style.display = 'flex';
      progressWrap.classList.add('show');
      videoEl.play().then(()=>{ isPlaying = true; updatePlayIcon(); }).catch(()=>{ isPlaying=false; updatePlayIcon(); });
    }, {once:true});

    videoEl.addEventListener('timeupdate', function(){
      if(videoEl.duration){
        progressFill.style.width = (videoEl.currentTime/videoEl.duration*100) + '%';
      }
    });

    videoEl.addEventListener('error', function(){
      loading.classList.remove('show');
      toast('Video yüklenemedi. Dosya bozuk olabilir.');
    });
  }

  function handleFile(file){
    if(!file) return;
    const url = URL.createObjectURL(file);
    if(file.type.startsWith('video/')){
      loadVideo(url, file.name);
    } else if(file.type.startsWith('image/')){
      loadImage(url, file.name);
    } else {
      toast('Desteklenmeyen dosya türü');
    }
  }

  fileInput.addEventListener('change', (e)=>{
    if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });

  /* drag & drop */
  ['dragenter','dragover'].forEach(ev=>{
    emptyEl.addEventListener(ev, (e)=>{ e.preventDefault(); emptyEl.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(ev=>{
    emptyEl.addEventListener(ev, (e)=>{ e.preventDefault(); emptyEl.classList.remove('dragover'); });
  });
  emptyEl.addEventListener('drop', (e)=>{
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  /* ---------- Video controls ---------- */
  function updatePlayIcon(){
    playIcon.innerHTML = isPlaying
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }
  playBtn.addEventListener('click', ()=>{
    if(!videoEl) return;
    if(isPlaying){ videoEl.pause(); isPlaying=false; }
    else { videoEl.play(); isPlaying=true; }
    updatePlayIcon();
  });
  muteBtn.addEventListener('click', ()=>{
    if(!videoEl) return;
    videoEl.muted = !videoEl.muted;
    muteBtn.classList.toggle('active', !videoEl.muted);
    muteIcon.innerHTML = videoEl.muted
      ? '<path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/>'
      : '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/>';
  });

  /* ---------- Fullscreen ---------- */
  fsBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });

  initThree();
})();
</script>
</body>
</html>
